name: Python CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Step 3: Create a virtual environment
      - name: Create virtual environment
        run: python -m venv venv

      ## Step 4: Install dependencies
      - name: Install dependencies
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install httpx2

      # Step 5: Run tests
      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          source venv/bin/activate
          pytest -v


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 6: Build Docker image locally
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            mayuri67/python-ci-project:latest
            mayuri67/python-ci-project:${{ github.sha }}

      # Step 7: Scan Docker image using Trivy
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mayuri67/python-ci-project:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # Step 8: Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      # Step 9: Push Docker image
      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push mayuri67/python-ci-project:latest
          docker push mayuri67/python-ci-project:${{ github.sha }}